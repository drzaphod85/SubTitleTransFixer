<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7be0"/>
      <stop offset="1" stop-color="#0b2e6e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#253d7a"/>
      <stop offset="0.55" stop-color="#e98a5c"/>
      <stop offset="0.8" stop-color="#f7c27a"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6b5a"/>
      <stop offset="1" stop-color="#1c3a33"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21443b"/>
      <stop offset="1" stop-color="#0d2520"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc55"/>
      <stop offset="1" stop-color="#f6b900"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc55"/>
      <stop offset="1" stop-color="#f2b200"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="scr"><rect x="176" y="226" width="672" height="452" rx="44"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>

  <g transform="translate(0,16)">
  <!-- Skärmram -->
  <rect x="164" y="214" width="696" height="476" rx="54" fill="#0a1630"/>
  <!-- Filmscen -->
  <g clip-path="url(#scr)">
    <rect x="176" y="226" width="672" height="452" fill="url(#sky)"/>
    <circle cx="640" cy="420" r="58" fill="#ffe2a8" opacity="0.95"/>
    <path d="M176 470 C 290 400, 400 430, 500 455 S 720 420, 848 445 L848 678 L176 678 Z" fill="url(#hill1)"/>
    <path d="M176 530 C 300 480, 420 520, 560 515 S 760 490, 848 520 L848 678 L176 678 Z" fill="url(#hill2)"/>
    <rect x="176" y="226" width="672" height="452" fill="url(#shade)"/>
  </g>
  <rect x="176" y="226" width="672" height="452" rx="44" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="4"/>

  <!-- Stativ -->
  <path d="M462 690 L562 690 L578 748 L446 748 Z" fill="#0a2350"/>
  <rect x="380" y="744" width="264" height="28" rx="14" fill="#e9eff9"/>

  <!-- Original (engelska), tonad -->
  <rect x="300" y="520" width="424" height="56" rx="18" fill="#ffffff" opacity="0.88" filter="url(#soft)"/>
  <rect x="330" y="540" width="160" height="16" rx="8" fill="#6c7a92"/>
  <rect x="504" y="540" width="190" height="16" rx="8" fill="#6c7a92"/>

  <!-- Svensk översättning -->
  <rect x="244" y="592" width="536" height="66" rx="22" fill="url(#yellow)" filter="url(#soft)"/>
  <rect x="278" y="616" width="218" height="18" rx="9" fill="#0a4f9e"/>
  <rect x="512" y="616" width="234" height="18" rx="9" fill="#0a4f9e"/>

  <!-- Å-bricka -->
  <g filter="url(#shadow)">
    <circle cx="790" cy="252" r="92" fill="url(#badge)" stroke="#ffffff" stroke-width="10"/>
  </g>
  <text x="790" y="292" text-anchor="middle" font-family="Inter Display, Inter, sans-serif" font-weight="800" font-size="118" fill="#0a4f9e">Å</text>
  </g>
</svg>
