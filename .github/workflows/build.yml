# Builds the app on every pull request and push to main, so that compile errors
# show up before a release.
name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check translations
        run: python3 scripts/localization.py check
      - name: Build
        run: swift build -c release
