# Builds, signs, notarizes and publishes SubTitle TransFixer.
#
# Runs when a version tag is pushed (git tag v1.0.0 && git push origin v1.0.0),
# or by hand from the Actions tab (always a draft release).
#
# Signing and notarization need these repository secrets (see README → Releases):
#   MACOS_CERTIFICATE_P12       base64 of the exported "Developer ID Application" .p12
#   MACOS_CERTIFICATE_PASSWORD  the password chosen when exporting the .p12
#   APPLE_ID                    the Apple ID of the developer account
#   APPLE_TEAM_ID               the 10-character team ID
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID
# Without them the app is built unsigned and published as a draft release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.0.0 (creates a draft release)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      APP_NAME: SubTitle TransFixer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v${INPUT_VERSION#v}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Building $TAG"

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Check translations
        run: python3 scripts/localization.py check

      - name: Import signing certificate
        id: cert
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12" ]]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 secret – building an unsigned draft release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep -F '"Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/' || true)"
          if [[ -z "$IDENTITY" ]]; then
            echo "::error::The certificate in MACOS_CERTIFICATE_P12 is not a \"Developer ID Application\" certificate."
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the app (Apple silicon + Intel)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          UNIVERSAL: "1"
          SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          ./build-app.sh
          lipo -info "build/$APP_NAME.app/Contents/MacOS/SubTitleTransFixer"

      - name: Create the disk image
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IDENTITY: ${{ steps.cert.outputs.identity }}
        run: |
          DMG="SubTitle-TransFixer-$VERSION.dmg"
          STAGE="$RUNNER_TEMP/dmg"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "build/$APP_NAME.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "$APP_NAME $VERSION" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          if [[ -n "$IDENTITY" ]]; then
            codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          fi
          echo "file=$DMG" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple
        if: steps.cert.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          DMG: ${{ steps.dmg.outputs.file }}
        run: |
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_PASSWORD" ]]; then
            echo "::error::APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD are needed for notarization."
            exit 1
          fi
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m --output-format json | tee notary.json
          STATUS="$(python3 -c 'import json; print(json.load(open("notary.json")).get("status", ""))')"
          if [[ "$STATUS" != "Accepted" ]]; then
            ID="$(python3 -c 'import json; print(json.load(open("notary.json")).get("id", ""))')"
            echo "::error::Notarization ended with status \"$STATUS\". Apple's log follows."
            [[ -n "$ID" ]] && xcrun notarytool log "$ID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          # The CHANGELOG.md section whose heading contains "[<version>]".
          awk -v v="[$VERSION]" '/^## /{ p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "See [CHANGELOG.md](CHANGELOG.md)." > notes.md
          if [[ "$SIGNED" != "true" ]]; then
            printf '\n> **Note:** this build is not signed or notarized. macOS will refuse to open it until you right-click the app and choose **Open**.\n' >> notes.md
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          DMG: ${{ steps.dmg.outputs.file }}
          SIGNED: ${{ steps.cert.outputs.signed }}
        run: |
          shasum -a 256 "$DMG" | tee "$DMG.sha256"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            DRAFT=""
            if [[ "$SIGNED" != "true" || "$GITHUB_REF_TYPE" != "tag" ]]; then DRAFT="--draft"; fi
            gh release create "$TAG" "$DMG" "$DMG.sha256" --title "$APP_NAME $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA" $DRAFT
          fi

      - name: Keep the disk image as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.file }}
          path: ${{ steps.dmg.outputs.file }}
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
